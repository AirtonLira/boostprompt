[project]
name = "boostprompt"
version = "1.0.1"
description = "CLI de discovery com LangChain, LangGraph e Pydantic AI"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Airton Lira", email = "airton@example.com"}
]
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.0.0",
    "pydantic-ai>=0.0.10",
    "duckdb>=1.0.0",
    "textual>=0.50.0",
    "litellm>=1.40.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
boostprompt = "boostprompt.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boostprompt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.coverage.run]
branch = true
source = ["src/boostprompt"]

[tool.coverage.report]
show_missing = true
